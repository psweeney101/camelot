name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Workers and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#nx-cloud-start-workers
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      - run: npx nx-cloud start-workers

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx record -- npm run check

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
