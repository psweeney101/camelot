name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Cancel superseded PR runs, but let runs on main finish so the cache gets populated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Use the read/write token only on pushes to main
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_TOKEN_READ_WRITE || secrets.NX_CLOUD_TOKEN_READ }}

    steps:
      # Checkout full history
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # Enables task distribution via Nx Cloud.
      # Run as early as possible, before dependencies are installed.
      # Configure workers in .nx/ci-config.yaml
      - run: npx nx-cloud start-workers

      # Install Node and restore the npm download cache between runs
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      # Clean install from package-lock.json
      - run: npm ci

      # Hotfix: https://github.com/nrwl/nx/issues/37815
      - run: npx nx reset --onlyCloud || true

      # Sets NX_BASE and NX_HEAD so `affected` commands compare against the right commits
      - uses: nrwl/nx-set-shas@v4

      # Run checks
      - run: npx nx record -- npm run check

      # Self-healing CI: Nx Cloud suggests fixes for failures
      - run: npx nx fix-ci
        if: always()
